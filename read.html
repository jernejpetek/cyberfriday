<!DOCTYPE html>
<html lang="en">
<head>
  <script src="assets/theme.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>CyberFriday — Reading</title>

  <meta
    name="description"
    content="CyberFriday article reader for Markdown notes, labs, projects, and research posts."
  />

  <link rel="stylesheet" href="assets/style.css" />

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
</head>

<body data-page="read">
  <a class="skip" href="#content">Skip to content</a>

  <header class="site-header">
    <div class="header-container header-inner">
      <a class="brand" href="index.html">CyberFriday</a>

      <nav class="nav" aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="blog.html">Blog</a>
        <a href="labs.html">Labs</a>
        <a href="projects.html">Projects</a>
        <a href="research.html">Research</a>
        <a href="about.html">About</a>
      </nav>
    </div>
  </header>

  <main id="content">
    <section class="pagehead">
      <div class="container pagehead-inner">
        <a class="back-link" id="backLink" href="blog.html">← Back</a>

        <h1 id="postTitle">Loading…</h1>

        <p id="postSub">
          CyberFriday
        </p>

        <p class="readmeta" id="readMeta"></p>
      </div>
    </section>

    <section class="section read-page">
      <div class="container read-container">
        <article id="articleContent" class="article">
          Loading…
        </article>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container footer-inner">
      <p>© <span id="year"></span> CyberFriday</p>

      <div class="footer-links">
        <a href="about.html">About</a>
        <a href="projects.html">Projects</a>
        <a href="https://github.com/jernejpetek">GitHub</a>
      </div>
    </div>
  </footer>

  <script src="assets/app.js" defer></script>

  <script>
    const articleContent = document.getElementById("articleContent");
    const postTitle = document.getElementById("postTitle");
    const postSub = document.getElementById("postSub");
    const readMeta = document.getElementById("readMeta");
    const backLink = document.getElementById("backLink");

    function isRelativeUrl(url) {
      return url &&
        !url.startsWith("http://") &&
        !url.startsWith("https://") &&
        !url.startsWith("data:") &&
        !url.startsWith("/") &&
        !url.startsWith("#");
    }

    function getBaseUrl(target) {
      const url = new URL(target, window.location.href);
      return url.href.substring(0, url.href.lastIndexOf("/") + 1);
    }

    function getSectionFromPath(path) {
      if (path.startsWith("blog/")) {
        return {
          label: "Blog",
          href: "blog.html"
        };
      }

      if (path.startsWith("labs/")) {
        return {
          label: "Labs",
          href: "labs.html"
        };
      }

      if (path.startsWith("projects/")) {
        return {
          label: "Projects",
          href: "projects.html"
        };
      }

      if (path.startsWith("research/")) {
        return {
          label: "Research",
          href: "research.html"
        };
      }

      if (path.startsWith("notes/")) {
        return {
          label: "Blog",
          href: "blog.html"
        };
      }

      if (path.startsWith("writeups/")) {
        return {
          label: "Labs",
          href: "labs.html"
        };
      }

      return {
        label: "CyberFriday",
        href: "index.html"
      };
    }

    function enhanceCodeBlocks(root) {
      root.querySelectorAll("pre > code").forEach((codeElement) => {
        const pre = codeElement.parentElement;

        const className = Array.from(codeElement.classList)
          .find((classItem) => classItem.startsWith("language-"));

        const language = className
          ? className.replace("language-", "")
          : "code";

        const wrapper = document.createElement("div");
        wrapper.className = "codeblock";

        const header = document.createElement("div");
        header.className = "codeblock__head";

        const languageLabel = document.createElement("div");
        languageLabel.className = "codeblock__lang";
        languageLabel.textContent = language;

        const copyButton = document.createElement("button");
        copyButton.type = "button";
        copyButton.className = "codeblock__copy";
        copyButton.textContent = "Copy code";

        copyButton.addEventListener("click", async () => {
          const code = codeElement.textContent || "";

          try {
            await navigator.clipboard.writeText(code);
            copyButton.textContent = "Copied";
            setTimeout(() => {
              copyButton.textContent = "Copy code";
            }, 900);
          } catch {
            const textarea = document.createElement("textarea");
            textarea.value = code;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand("copy");
            document.body.removeChild(textarea);

            copyButton.textContent = "Copied";
            setTimeout(() => {
              copyButton.textContent = "Copy code";
            }, 900);
          }
        });

        header.appendChild(languageLabel);
        header.appendChild(copyButton);

        pre.replaceWith(wrapper);
        wrapper.appendChild(header);
        wrapper.appendChild(pre);
      });
    }

    async function loadMarkdown(path) {
      const response = await fetch(path, { cache: "no-store" });

      if (!response.ok) {
        throw new Error("Could not load " + path);
      }

      return response.text();
    }

    async function renderMarkdown() {
      const params = new URLSearchParams(window.location.search);
      const markdownPath = params.get("md");

      if (!markdownPath) {
        postTitle.textContent = "Missing file";
        postSub.textContent = "No Markdown file was provided.";
        readMeta.textContent = "";
        articleContent.textContent = "Use read.html?md=blog/example.md";
        return;
      }

      // Restrict fetching to Markdown inside the public content directories.
      const validPath = /^(blog|labs|learning-resources|research|projects)\/[A-Za-z0-9_./% -]+\.md$/i.test(markdownPath)
        && !markdownPath.split("/").includes("..")
        && !markdownPath.includes("\\")
        && !markdownPath.includes("%2e")
        && !markdownPath.includes("%2f");
      if (!validPath) {
        postTitle.textContent = "Invalid article path";
        postSub.textContent = "Select an article from Blog or Labs.";
        readMeta.textContent = "";
        articleContent.textContent = "Only local Markdown articles can be opened.";
        return;
      }
      const section = getSectionFromPath(markdownPath);
      backLink.href = section.href;
      backLink.textContent = "← Back to " + section.label;
      postSub.textContent = section.label;
      readMeta.textContent = markdownPath;

      try {
        const markdown = await loadMarkdown(markdownPath);

        marked.setOptions({
          gfm: true,
          breaks: false
        });

        const rendered = marked.parse(markdown);
        articleContent.innerHTML = DOMPurify.sanitize(rendered);

        const h1 = articleContent.querySelector("h1");

        if (h1) {
          postTitle.textContent = h1.textContent.trim();
          h1.remove();
        } else {
          postTitle.textContent = "CyberFriday";
        }

        const baseUrl = getBaseUrl(markdownPath);

        articleContent.querySelectorAll("img").forEach((image) => {
          const src = image.getAttribute("src");

          if (isRelativeUrl(src)) {
            image.src = new URL(src, baseUrl).toString();
          }
        });

        articleContent.querySelectorAll("a").forEach((link) => {
          const href = link.getAttribute("href");

          if (isRelativeUrl(href)) {
            link.href = new URL(href, baseUrl).toString();
          }

          if (link.href.startsWith("http://") || link.href.startsWith("https://")) {
            link.target = "_blank";
            link.rel = "noopener noreferrer";
          }
        });

        enhanceCodeBlocks(articleContent);
      } catch (error) {
        console.error(error);

        postTitle.textContent = "Could not load content";
        postSub.textContent = "CyberFriday";
        readMeta.textContent = markdownPath;
        articleContent.textContent = String(error);
      }
    }

    renderMarkdown();
  </script>
  <script src="assets/analytics.js" defer></script>
</body>
</html>
